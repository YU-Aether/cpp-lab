name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # CMake ≥ 3.28：ubuntu-24.04 自带 3.28+，无需额外安装
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libgtest-dev qt6-base-dev libgl1-mesa-dev

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build --parallel

      # Qt 用例走 offscreen，无需显示服务
      # 若 Runner 禁止组播导致 sd_multicast_test 不稳定，可改用：
      #   ctest --test-dir build --output-on-failure -E sd_multicast_test
      - name: 测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
